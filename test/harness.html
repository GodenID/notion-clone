<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>harness</title>
  </head>
  <body>
    <pre id="out">running…</pre>
    <iframe id="frame" src="/app.html" style="width: 1200px; height: 800px"></iframe>
    <script type="module">
      const results = [];
      const log = (name, ok, extra = "") =>
        results.push(`${ok ? "PASS" : "FAIL"} ${name}${extra ? ` — ${extra}` : ""}`);

      const block = (id, text = "", extra = {}) => ({
        id,
        type: "paragraph",
        text,
        level: 0,
        checked: false,
        ...extra,
      });

      localStorage.setItem(
        "notion-clone:session",
        JSON.stringify({ name: "Harness", email: "h@test.dev", color: "#2383e2" })
      );

      const page = {
        id: "h-page",
        title: "Harness",
        icon: "🧪",
        cover: null,
        section: "private",
        teamspaceId: null,
        parentId: null,
        favorite: false,
        updatedAt: Date.now(),
        trashedAt: null,
        locked: false,
        fullWidth: false,
        smallText: false,
        font: "default",
        versions: [],
        lastVersionAt: 0,
        comments: [],
        blocks: [
          block("h1", ""),
          block("h2", "colour me", { color: "", background: "" }),
          block("h3", "", { type: "template", label: "Kickoff", template: [{ type: "bulleted", text: "alpha" }, { type: "todo", text: "beta", checked: false }] }),
          block("h4", "", {
            type: "database",
            properties: [
              { id: "title", name: "Name", type: "title" },
              { id: "status", name: "Status", type: "status", options: ["To-do", "In progress", "Done"] },
              { id: "price", name: "Price", type: "number" },
              { id: "date", name: "Date", type: "date" },
            ],
            views: [
              { id: "table", name: "Table", type: "table" },
              { id: "board", name: "Board", type: "board" },
              { id: "gallery", name: "Gallery", type: "gallery" },
              { id: "list", name: "List", type: "list" },
              { id: "calendar", name: "Calendar", type: "calendar" },
              { id: "timeline", name: "Timeline", type: "timeline" },
            ],
            activeView: "table",
            rows: [
              { id: "r1", shortId: "nc-a", createdAt: Date.now(), updatedAt: Date.now(), cells: { title: "Ship v1", status: "To-do", price: 10, date: "2026-10-18" } },
              { id: "r2", shortId: "nc-b", createdAt: Date.now(), updatedAt: Date.now(), cells: { title: "Ship v2", status: "Done", price: 20, date: "2026-10-24" } },
            ],
          }),
          block("h5", "", { type: "columns4", columns: [] }),
          block("h6", "", { type: "button", label: "Docs", url: "https://example.com" }),
          block("h7", "", { type: "page", pageId: "" }),
          block("h8", "", { type: "table", rows: [["A", "B"], ["1", "2"]], headerRow: true, headerColumn: true, cellColors: {} }),
          block("h9", "", { type: "video", src: "", url: "https://youtu.be/dQw4w9WgXcQ", caption: "" }),
          block("h10", "", { type: "embed", url: "https://www.figma.com/design/abc123/Foo", title: "" }),
          block("h11", "", { type: "audio", src: "", url: "", caption: "" }),
          block("h12", "Math $a+b$ tail", { type: "paragraph" }),
          block("h13", "", { type: "breadcrumb" }),
          block("h14", "", { type: "code", language: "javascript", text: 'const x = "hello";\n// note\nfunction go() { return 2 }', wrap: false }),
          block("h15", "", { type: "toc" }),
          block("h16", "Heading one", { type: "h1" }),
          block("h17", "Heading two", { type: "h2" }),
          block("h18", "Heading three", { type: "h3" }),
        ],
      };

      const sibling = {
        id: "h-sibling",
        title: "Sibling page",
        icon: "📘",
        cover: null,
        section: "private",
        teamspaceId: null,
        parentId: null,
        favorite: false,
        updatedAt: Date.now(),
        trashedAt: null,
        comments: [],
        blocks: [block("s1", "hello")],
      };

      localStorage.setItem(
        "notion-clone:v2",
        JSON.stringify({
          version: 2,
          workspace: { name: "Harness" },
          theme: "light",
          activeView: { type: "page", id: "h-page" },
          collapsedTeamspaces: [],
          syncedBlocks: {},
          teamspaces: [],
          pages: [page, sibling],
          onboarded: true,
        })
      );

      const frame = document.getElementById("frame");
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      frame.addEventListener("load", async () => {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        win.addEventListener("error", (event) => {
          results.push(`FAIL window error — ${event.message}`);
        });

        const click = (node) => node?.dispatchEvent(new win.MouseEvent("click", { bubbles: true }));
        const mousedown = (node) => node?.dispatchEvent(new win.MouseEvent("mousedown", { bubbles: true }));
        const keydown = (node, init) => node?.dispatchEvent(new win.KeyboardEvent("keydown", { bubbles: true, ...init }));
        const input = (node, value) => {
          node.textContent = value;
          node.dispatchEvent(new win.InputEvent("input", { bubbles: true }));
        };

        try {
          await sleep(500);

          /* ---------- editor basics ---------- */
          const editor = doc.getElementById("editor");
          log("editor rendered", Boolean(editor && editor.children.length >= 18), `blocks=${editor?.children.length}`);

          const first = doc.querySelector('[data-id="h1"] .block__input');
          first.focus();
          keydown(first, { key: "/" });
          await sleep(120);
          input(first, "/");
          await sleep(140);
          const menu = doc.getElementById("slash-menu");
          log("slash menu opens", !menu.hidden);
          log("slash categories render", menu.querySelectorAll(".slash-group").length >= 4);
          log("slash menu is aria-live", Boolean(menu.getAttribute("aria-activedescendant")), menu.getAttribute("aria-activedescendant"));
          const toggleItem = [...menu.querySelectorAll(".slash-item")].find((node) => node.dataset.type === "toggleh1");
          mousedown(toggleItem);
          await sleep(180);
          log("toggle heading inserted", doc.querySelector('[data-id="h1"]')?.dataset.type === "toggleh1");
          log("toggle chevron present", Boolean(doc.querySelector('[data-id="h1"] .toggle-chevron')));

          /* ---------- mentions ---------- */
          const target = doc.querySelector('[data-id="h16"] .block__input');
          target.focus();
          keydown(target, { key: "@" });
          await sleep(200);
          const mentionMenu = doc.getElementById("mention-menu");
          log("mention menu opens", !mentionMenu.hidden);
          const mentionItems = mentionMenu.querySelectorAll(".mention-item");
          log("mention lists pages + dates", mentionItems.length >= 3, `items=${mentionItems.length}`);
          const siblingMention = [...mentionItems].find((node) => node.textContent.includes("Sibling"));
          log("mention finds sibling page", Boolean(siblingMention));
          mousedown(siblingMention);
          await sleep(200);
          log("mention inserted", Boolean(doc.querySelector(".mention")), doc.querySelector(".mention")?.textContent);

          /* ---------- quick commands ---------- */
          const quick = doc.querySelector('[data-id="h17"] .block__input');
          quick.focus();
          quick.textContent = "/today";
          quick.dispatchEvent(new win.InputEvent("input", { bubbles: true }));
          await sleep(220);
          log(
            "slash /today becomes a date",
            doc.querySelector('[data-id="h17"]')?.dataset.type === "date",
            doc.querySelector('[data-id="h17"]')?.dataset.type
          );

          /* ---------- code block ---------- */
          const codeBlock = doc.querySelector('[data-id="h14"]');
          log("code highlights keywords", Boolean(codeBlock?.querySelector(".tok-keyword")));
          log("code highlights strings", Boolean(codeBlock?.querySelector(".tok-string")));
          log("code has language label", codeBlock?.querySelector(".code-lang")?.textContent === "JavaScript");
          click(codeBlock.querySelector('[data-code-action="wrap"]'));
          await sleep(160);
          log("code wrap toggles", doc.querySelector('[data-id="h14"] .code-wrap')?.classList.contains("is-wrapped"));
          click(doc.querySelector('[data-id="h14"] .code-lang'));
          await sleep(120);
          log("language picker opens", Boolean(doc.querySelector(".code-lang-picker")));
          const python = [...(doc.querySelectorAll(".code-lang-picker button") || [])].find((n) => n.dataset.language === "python");
          click(python);
          await sleep(160);
          log("language switches", doc.querySelector('[data-id="h14"] .code-lang')?.textContent === "Python");

          /* ---------- table ---------- */
          const tableBlock = doc.querySelector('[data-id="h8"]');
          click(tableBlock.querySelector('[data-table-action="col"]'));
          await sleep(150);
          log("table adds column", doc.querySelectorAll('[data-id="h8"] .table-cell[data-col="2"]').length >= 2, `cells=${doc.querySelectorAll('[data-id="h8"] .table-cell').length}`);
          click(doc.querySelector('[data-id="h8"] [data-table-action="delete-col"]'));
          await sleep(150);
          log("table deletes column", doc.querySelectorAll('[data-id="h8"] .table-cell[data-col="2"]').length === 0, `cells=${doc.querySelectorAll('[data-id="h8"] .table-cell').length}`);
          click(doc.querySelector('[data-id="h8"] [data-table-action="delete-row"]'));
          await sleep(150);
          const rowsLeft = doc.querySelectorAll('[data-id="h8"] .block__table tr').length;
          const tableState = JSON.parse(win.localStorage.getItem("notion-clone:v2")).pages
            .find((p) => p.id === "h-page")
            .blocks.find((b) => b.id === "h8");
          log("table deletes row", rowsLeft === 1, `rows=${rowsLeft} state=${JSON.stringify(tableState.rows)}`);
          click(doc.querySelector('[data-id="h8"] [data-table-action="align-center"]'));
          await sleep(150);
          log("table aligns center", doc.querySelector('[data-id="h8"] .block__table')?.dataset.align === "center");

          /* ---------- database ---------- */
          const db = doc.querySelector('[data-id="h4"] .database-block');
          log("database renders toolbar", Boolean(db?.querySelector(".db-toolbar")));
          click(db.querySelector('[data-db-action="view"][data-view="board"]'));
          await sleep(200);
          log("board view renders", Boolean(doc.querySelector('[data-id="h4"] .db-board')));
          log("board groups by status", doc.querySelectorAll('[data-id="h4"] .db-board-col').length >= 2);

          click(doc.querySelector('[data-id="h4"] [data-db-action="view"][data-view="table"]'));
          await sleep(200);
          click(doc.querySelector('[data-id="h4"] [data-db-action="add-property"]'));
          await sleep(200);
          log("type picker opens", Boolean(doc.querySelector('[data-id="h4"] .db-type-picker')));
          const createBtn = doc.querySelector('[data-id="h4"] .db-type-picker [data-db-action="property-create"][data-db-type="formula"]');
          click(createBtn);
          await sleep(220);
          const dbState = JSON.parse(win.localStorage.getItem("notion-clone:v2")).pages
            .find((p) => p.id === "h-page")
            .blocks.find((b) => b.id === "h4");
          log("property created", dbState.properties.length === 5, `props=${dbState.properties.length}`);

          click(doc.querySelector('[data-id="h4"] .db-prop-name'));
          await sleep(200);
          const formulaSelect = doc.querySelector('[data-id="h4"] .db-prop-menu [data-db-action="property-type"]');
          log("property menu opens", Boolean(formulaSelect));
          void formulaSelect;

          click(doc.querySelector('[data-id="h4"] [data-db-action="filters"]'));
          await sleep(180);
          log("filter panel opens", Boolean(doc.querySelector('[data-id="h4"] .db-filters-panel')));
          click(doc.querySelector('[data-id="h4"] [data-db-action="filter-add"]'));
          await sleep(200);
          const filterCount = JSON.parse(win.localStorage.getItem("notion-clone:v2")).pages
            .find((p) => p.id === "h-page")
            .blocks.find((b) => b.id === "h4").filters.length;
          log("filter rule added", filterCount === 1, `filters=${filterCount}`);
          click(doc.querySelector('[data-id="h4"] [data-db-action="filter-clear"]'));
          await sleep(180);

          click(doc.querySelector('[data-id="h4"] [data-db-action="view-menu"]'));
          await sleep(180);
          log("view menu opens", Boolean(doc.querySelector('[data-id="h4"] .db-view-menu')));
          click(doc.querySelector('[data-id="h4"] [data-db-action="view-menu-close"]'));
          await sleep(120);

          /* ---------- block colours ---------- */
          const colourTarget = doc.querySelector('[data-id="h2"]');
          colourTarget.querySelector('[data-control="menu"]').dispatchEvent(new win.MouseEvent("click", { bubbles: true }));
          await sleep(80);
          const blockMenu = doc.getElementById("block-menu");
          click(blockMenu.querySelector('[data-block-action="color"]'));
          await sleep(80);
          const swatches = blockMenu.querySelectorAll(".popover__swatch");
          log("colour swatches render", swatches.length === 20, `swatches=${swatches.length}`);
          click([...swatches].find((n) => n.dataset.color === "blue"));
          await sleep(160);
          log("text colour applied", doc.querySelector('[data-id="h2"]')?.classList.contains("is-color-blue"));
          click([...blockMenu.querySelectorAll(".popover__swatch")].find((n) => n.dataset.color === "red" && n.dataset.blockAction === "background"));
          await sleep(160);
          log("background colour applied", doc.querySelector('[data-id="h2"]')?.classList.contains("is-bg-red"));
          blockMenu.hidden = true;

          /* ---------- template ---------- */
          const before = doc.querySelectorAll('[data-type="bulleted"]').length;
          click(doc.querySelector('[data-id="h3"] [data-template-action="insert"]'));
          await sleep(200);
          log("template inserts blocks", doc.querySelectorAll('[data-type="bulleted"]').length > before);

          /* ---------- media ---------- */
          log("video embed iframe", Boolean(doc.querySelector('[data-id="h9"] iframe')));
          log("figma embed iframe", Boolean(doc.querySelector('[data-id="h10"] iframe')));
          log("audio empty state", Boolean(doc.querySelector('[data-id="h11"] .media-empty')));
          log("inline math rendered", Boolean(doc.querySelector('[data-id="h12"] .math-inline .katex')));
          log("toc lists headings", doc.querySelectorAll('[data-id="h15"] .toc-link').length >= 2);
          log("breadcrumb renders", doc.querySelector(".breadcrumb-block")?.textContent.includes("Harness"));

          /* ---------- sub-pages ---------- */
          click(doc.querySelector('[data-page-block-action="create"]'));
          await sleep(300);
          log("sub-page created", Boolean(doc.querySelector(".page-card")));

          /* ---------- persistence ---------- */
          const raw = JSON.parse(win.localStorage.getItem("notion-clone:v2"));
          const stored = raw.pages.find((p) => p.id === "h-page");
          log("state persisted", stored.blocks.some((b) => b.type === "toggleh1"));
          log("colour persisted", stored.blocks.some((b) => b.color === "blue"));
          log("mention persisted", (stored.blocks.find((b) => b.id === "h16")?.text || "").includes("mention"));

          /* ---------- command palette ---------- */
          doc.dispatchEvent(new win.KeyboardEvent("keydown", { key: "P", ctrlKey: true, shiftKey: true, bubbles: true }));
          await sleep(220);
          const palette = doc.getElementById("command-modal");
          log("palette opens with shortcut", !palette.hidden);
          const paletteInput = doc.getElementById("command-input");
          paletteInput.value = "dark";
          paletteInput.dispatchEvent(new win.Event("input", { bubbles: true }));
          await sleep(160);
          const paletteResults = doc.querySelectorAll("#command-results .search-result");
          log(
            "palette filters commands",
            paletteResults.length >= 1 && /dark/i.test(paletteResults[0].textContent),
            `results=${paletteResults.length} first="${paletteResults[0]?.textContent?.trim().slice(0, 40)}"`
          );
          doc.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
          await sleep(150);
          log("palette closes on escape", palette.hidden);

          /* ---------- shortcut sheet ---------- */
          doc.dispatchEvent(new win.KeyboardEvent("keydown", { key: "?", bubbles: true }));
          await sleep(200);
          const sheet = doc.getElementById("shortcuts-modal");
          log("shortcut sheet opens", !sheet.hidden);
          log(
            "shortcut sheet lists groups",
            doc.querySelectorAll("#shortcut-grid .shortcut-group").length >= 5,
            `groups=${doc.querySelectorAll("#shortcut-grid .shortcut-group").length}`
          );
          log(
            "shortcut sheet lists keys",
            doc.querySelectorAll("#shortcut-grid .shortcut-keys").length > 30,
            `keys=${doc.querySelectorAll("#shortcut-grid .shortcut-keys").length}`
          );
          click(doc.getElementById("shortcuts-done"));
          await sleep(150);
          log("shortcut sheet closes", sheet.hidden);

          /* ---------- onboarding ---------- */
          doc.dispatchEvent(new win.KeyboardEvent("keydown", { key: "P", ctrlKey: true, shiftKey: true, bubbles: true }));
          await sleep(180);
          const tourInput = doc.getElementById("command-input");
          tourInput.value = "tour";
          tourInput.dispatchEvent(new win.Event("input", { bubbles: true }));
          await sleep(160);
          click(doc.querySelector("#command-results .search-result"));
          await sleep(250);
          const onboarding = doc.getElementById("onboarding-modal");
          log("onboarding opens", !onboarding.hidden);
          log("onboarding shows points", doc.querySelectorAll("#onboarding-points li").length >= 3);
          click(doc.getElementById("onboarding-next"));
          await sleep(150);
          log(
            "onboarding advances",
            doc.getElementById("onboarding-title").textContent !== "Welcome to your workspace"
          );
          click(doc.getElementById("onboarding-skip"));
          await sleep(150);
          log("onboarding closes", onboarding.hidden);

          /* ---------- fuzzy search ---------- */
          doc.dispatchEvent(new win.KeyboardEvent("keydown", { key: "k", ctrlKey: true, bubbles: true }));
          await sleep(200);
          const searchField = doc.getElementById("search-input");
          searchField.value = "sibl";
          searchField.dispatchEvent(new win.Event("input", { bubbles: true }));
          await sleep(200);
          const searchResults = doc.querySelectorAll("#search-results .search-result");
          log(
            "fuzzy search finds a page",
            searchResults.length >= 1 && /sibling/i.test(searchResults[0].textContent),
            `query="${searchField.value}" results=${searchResults.length} labels="${[
              ...searchResults,
            ]
              .map((n) => n.querySelector(".search-result__label")?.textContent?.trim() || "?")
              .join(" // ")}`
          );
          log("fuzzy search highlights matches", Boolean(doc.querySelector("#search-results mark")));
          doc.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
          await sleep(120);
        } catch (error) {
          log("harness error", false, String(error?.stack || error));
        }

        document.getElementById("out").textContent = results.join("\n");
        document.title = results.some((line) => line.startsWith("FAIL")) ? "FAILED" : "ALL PASS";
      });
    </script>
  </body>
</html>
