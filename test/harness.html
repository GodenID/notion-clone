<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>harness</title>
  </head>
  <body>
    <pre id="out">running…</pre>
    <iframe id="frame" src="/app.html" style="width: 1200px; height: 800px"></iframe>
    <script type="module">
      const results = [];
      const log = (name, ok, extra = "") =>
        results.push(`${ok ? "PASS" : "FAIL"} ${name}${extra ? ` — ${extra}` : ""}`);

      const block = (id, text = "", extra = {}) => ({
        id,
        type: "paragraph",
        text,
        level: 0,
        checked: false,
        ...extra,
      });

      localStorage.setItem(
        "notion-clone:session",
        JSON.stringify({ name: "Harness", email: "h@test.dev", color: "#2383e2" })
      );

      const page = {
        id: "h-page",
        title: "Harness",
        icon: "🧪",
        cover: null,
        section: "private",
        teamspaceId: null,
        parentId: null,
        favorite: false,
        updatedAt: Date.now(),
        trashedAt: null,
        comments: [],
        locked: false,
        fullWidth: false,
        smallText: false,
        font: "default",
        versions: [],
        lastVersionAt: 0,
        blocks: [
          block("h1", ""),
          block("h2", "colour me", { color: "", background: "" }),
          block("h3", "", { type: "template", label: "Kickoff", template: [{ type: "bulleted", text: "alpha" }, { type: "todo", text: "beta", checked: false }] }),
          block("h4", "", {
            type: "database",
            properties: [
              { id: "title", name: "Name", type: "title" },
              { id: "status", name: "Status", type: "select", options: ["Todo", "Done"] },
              { id: "date", name: "Date", type: "date" },
            ],
            views: [
              { id: "table", name: "Table", type: "table" },
              { id: "board", name: "Board", type: "board" },
              { id: "gallery", name: "Gallery", type: "gallery" },
              { id: "list", name: "List", type: "list" },
              { id: "calendar", name: "Calendar", type: "calendar" },
              { id: "timeline", name: "Timeline", type: "timeline" },
            ],
            activeView: "calendar",
            rows: [{ id: "r1", cells: { title: "Kickoff", status: "Todo", date: "2026-10-18" } }],
          }),
          block("h5", "", { type: "columns4", columns: [] }),
          block("h6", "", { type: "button", label: "Docs", url: "https://example.com" }),
          block("h7", "", { type: "page", pageId: "" }),
          block("h8", "", { type: "table", rows: [["A", "B"], ["1", "2"]], headerRow: true, headerColumn: true, cellColors: {} }),
          block("h9", "", { type: "video", src: "", url: "https://youtu.be/dQw4w9WgXcQ", caption: "" }),
          block("h10", "", { type: "embed", url: "https://www.figma.com/design/abc123/Foo", title: "" }),
          block("h11", "", { type: "audio", src: "", url: "", caption: "" }),
          block("h12", "Math $a+b$ tail", { type: "paragraph" }),
          block("h13", "", { type: "breadcrumb" }),
        ],
      };

      localStorage.setItem(
        "notion-clone:v2",
        JSON.stringify({
          version: 2,
          workspace: { name: "Harness" },
          theme: "light",
          activeView: { type: "page", id: "h-page" },
          collapsedTeamspaces: [],
          syncedBlocks: {},
          teamspaces: [],
          pages: [page],
        })
      );

      const frame = document.getElementById("frame");
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      frame.addEventListener("load", async () => {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        win.addEventListener("error", (event) => {
          results.push(`FAIL window error — ${event.message}`);
        });

        try {
          await sleep(400);
          const editor = doc.getElementById("editor");
          log("editor rendered", Boolean(editor && editor.children.length >= 7), `blocks=${editor?.children.length}`);

          /* slash menu */
          const first = doc.querySelector('[data-id="h1"] .block__input');
          first.focus();
          first.dispatchEvent(new win.KeyboardEvent("keydown", { key: "/", bubbles: true }));
          await sleep(120);
          first.textContent = "/";
          first.dispatchEvent(new win.InputEvent("input", { bubbles: true }));
          await sleep(140);
          const menu = doc.getElementById("slash-menu");
          log("slash menu opens", !menu.hidden);
          log("slash categories render", menu.querySelectorAll(".slash-group").length >= 4, `groups=${menu.querySelectorAll(".slash-group").length}`);
          const item = [...menu.querySelectorAll(".slash-item")].find((node) => node.dataset.type === "toggleh1");
          log("toggle heading listed", Boolean(item));
          item?.dispatchEvent(new win.MouseEvent("mousedown", { bubbles: true }));
          await sleep(160);
          const toggled = doc.querySelector('[data-id="h1"]');
          log("toggle heading inserted", toggled?.dataset.type === "toggleh1", `type=${toggled?.dataset.type}`);
          log("toggle chevron present", Boolean(toggled?.querySelector(".toggle-chevron")));

          /* columns */
          const cols = doc.querySelector('[data-id="h5"] .columns-block');
          log("columns4 renders 4 cells", cols?.querySelectorAll(".block-column").length === 4, `cols=${cols?.querySelectorAll(".block-column").length}`);

          /* block colours */
          const target = doc.querySelector('[data-id="h2"]');
          target.querySelector('[data-control="menu"]').dispatchEvent(new win.MouseEvent("click", { bubbles: true }));
          await sleep(80);
          const blockMenu = doc.getElementById("block-menu");
          log("block menu opens", !blockMenu.hidden);
          blockMenu.querySelector('[data-block-action="color"]').dispatchEvent(new win.MouseEvent("click", { bubbles: true }));
          await sleep(80);
          const swatches = blockMenu.querySelectorAll(".popover__swatch");
          log("colour swatches render", swatches.length === 20, `swatches=${swatches.length}`);
          const blue = [...swatches].find((node) => node.dataset.color === "blue");
          blue.dispatchEvent(new win.MouseEvent("click", { bubbles: true }));
          await sleep(140);
          const recoloured = doc.querySelector('[data-id="h2"]');
          log("text colour applied", recoloured?.classList.contains("is-color-blue"), recoloured?.className);
          const redBg = [...blockMenu.querySelectorAll(".popover__swatch")].find((node) => node.dataset.color === "red" && node.dataset.blockAction === "background");
          redBg.dispatchEvent(new win.MouseEvent("click", { bubbles: true }));
          await sleep(140);
          log("background colour applied", doc.querySelector('[data-id="h2"]')?.classList.contains("is-bg-red"));
          blockMenu.hidden = true;

          /* template insert */
          const before = doc.querySelectorAll('[data-type="bulleted"]').length;
          doc.querySelector('[data-id="h3"] [data-template-action="insert"]').dispatchEvent(new win.MouseEvent("click", { bubbles: true }));
          await sleep(180);
          const after = doc.querySelectorAll('[data-type="bulleted"]').length;
          log("template inserts blocks", after > before, `${before} → ${after}`);

          /* calendar navigation */
          const monthBefore = doc.querySelector(".db-cal-title")?.textContent;
          doc.querySelector('[data-db-action="cal-next"]').dispatchEvent(new win.MouseEvent("click", { bubbles: true }));
          await sleep(160);
          const monthAfter = doc.querySelector(".db-cal-title")?.textContent;
          log("calendar month advances", Boolean(monthBefore && monthAfter && monthBefore !== monthAfter), `${monthBefore} → ${monthAfter}`);
          const addBtn = doc.querySelector(".db-cal-add");
          const rowsBefore = doc.querySelectorAll(".db-cal-item").length;
          addBtn.dispatchEvent(new win.MouseEvent("click", { bubbles: true }));
          await sleep(160);
          log("calendar add row", doc.querySelectorAll(".db-cal-item").length > rowsBefore);

          /* sub-page creation */
          doc.querySelector('[data-page-block-action="create"]').dispatchEvent(new win.MouseEvent("click", { bubbles: true }));
          await sleep(260);
          const card = doc.querySelector(".page-card");
          log("sub-page created", Boolean(card), card?.textContent?.trim().slice(0, 40));

          /* persistence */
          const raw = JSON.parse(win.localStorage.getItem("notion-clone:v2"));
          const stored = raw.pages.find((item) => item.id === "h-page");
          log("state persisted", stored.blocks.some((item) => item.type === "toggleh1"));
          log("colour persisted", stored.blocks.some((item) => item.color === "blue"));

          /* table */
          const cell = doc.querySelector('[data-id="h8"] .table-cell[data-row="0"][data-col="0"]');
          cell.focus();
          const headerToggle = doc.querySelector('[data-id="h8"] [data-table-action="header-row"]');
          headerToggle.dispatchEvent(new win.MouseEvent("click", { bubbles: true }));
          await sleep(140);
          const headerPressed = doc.querySelector('[data-id="h8"] [data-table-action="header-row"]');
          log("table header row toggles", headerPressed?.getAttribute("aria-pressed") === "false");

          doc.querySelector('[data-id="h8"] .table-cell[data-row="0"][data-col="0"]')?.focus();
          doc
            .querySelector('[data-id="h8"] [data-table-action="cell-color"][data-color="yellow"]')
            ?.dispatchEvent(new win.MouseEvent("click", { bubbles: true }));
          await sleep(160);
          const painted = doc.querySelector('[data-id="h8"] .table-cell[data-color]');
          log("table cell colour", Boolean(painted), painted?.dataset.color);

          /* media embeds */
          const videoFrame = doc.querySelector('[data-id="h9"] iframe');
          log("video embed iframe", Boolean(videoFrame), videoFrame?.src);
          const embedFrame = doc.querySelector('[data-id="h10"] iframe');
          log("figma embed iframe", Boolean(embedFrame), (embedFrame?.src || "").slice(0, 48));
          log("audio empty state", Boolean(doc.querySelector('[data-id="h11"] .media-empty')));

          /* inline math */
          const mathBlock = doc.querySelector('[data-id="h12"]');
          log(
            "inline math rendered",
            Boolean(mathBlock?.querySelector(".math-inline .katex")),
            mathBlock?.textContent.trim()
          );

          /* button + breadcrumb */
          const button = doc.querySelector('[data-id="h6"] .block-button');
          log("button label", button?.textContent === "Docs");
          const crumb = doc.querySelector(".breadcrumb-block");
          log("breadcrumb shows current page", Boolean(crumb) && crumb.textContent.includes("Harness"));

          /* media upload end-to-end */
          doc
            .querySelector('[data-id="h11"] [data-media-action="upload"]')
            ?.dispatchEvent(new win.MouseEvent("click", { bubbles: true }));
          await sleep(80);
          const fileInputs = [...doc.querySelectorAll('input[type="file"]')].filter(
            (input) => input.accept !== "image/*" && !input.accept.startsWith(".pdf")
          );
          log("media input available", fileInputs.length === 1, `inputs=${fileInputs.length}`);
          const bytes = new Uint8Array(2048).fill(7);
          const file = new win.File([bytes], "voice-note.mp3", { type: "audio/mpeg" });
          const transfer = new win.DataTransfer();
          transfer.items.add(file);
          fileInputs[0].files = transfer.files;
          fileInputs[0].dispatchEvent(new win.Event("change", { bubbles: true }));
          await sleep(700);
          const player = doc.querySelector('[data-id="h11"] audio');
          log("audio uploaded and rendered", Boolean(player), player?.getAttribute("src") || "");
          const meta = await win
            .fetch(player?.getAttribute("src") || "")
            .then((response) => ({ status: response.status, type: response.headers.get("content-type") }));
          log("uploaded media served", meta.status === 200 && meta.type === "audio/mpeg", JSON.stringify(meta));
        } catch (error) {
          log("harness error", false, String(error?.stack || error));
        }

        document.getElementById("out").textContent = results.join("\n");
        document.title = results.some((line) => line.startsWith("FAIL")) ? "FAILED" : "ALL PASS";
      });
    </script>
  </body>
</html>
